float:
  any:
  - base_args: ['@metric']
    constructor: Qdrant
    disabled: false
    docker_tag: ann-benchmarks-qdrant
    module: ann_benchmarks.algorithms.qdrant
    name: qdrant
    run_groups:
      # Single scalar-quantized (int8) HNSW build, matched to ArangoDB's
      # IVF{}_HNSW32,SQ8 run: same int8 scalar quantization and m=32 to mirror
      # the HNSW32 coarse-quantizer degree. Only the query-time hnsw_ef is swept
      # to trace the recall/QPS frontier. The full default matrix (3 quant x
      # 8 m x 4 ef_construct = 96 builds) is intractable on a 5.2M x 3072
      # dataset; widen this once a first result lands.
      scalar:
        args:
          - ['scalar']   # quantization: int8 scalar
          - [32]         # m: HNSW out-degree (mirrors ArangoDB HNSW32)
          - [256]        # ef_construct
        query_args:
          - [32, 64, 128, 256, 512]   # hnsw_ef sweep (recall/QPS trade-off)
          - [true]                    # rescore with full-precision vectors
